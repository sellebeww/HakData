name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: hakdata, POSTGRES_PASSWORD: hakdata_dev, POSTGRES_DB: hakdata }
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U hakdata" --health-interval 5s --health-retries 10
      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        env: { RABBITMQ_DEFAULT_USER: hakdata, RABBITMQ_DEFAULT_PASS: hakdata_dev }
        ports: ["5673:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 10s --health-retries 10
      # auth.int.ts dan phase6.int.ts membaca email yang benar-benar terkirim lewat API Mailpit
      mailpit:
        image: axllent/mailpit:v1.21
        ports: ["1025:1025", "8025:8025"]
    env:
      DATABASE_URL: postgresql://hakdata:hakdata_dev@localhost:5433/hakdata
      RABBITMQ_URL: amqp://hakdata:hakdata_dev@localhost:5673
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      UPLOAD_DIR: ./storage/evidence
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @hakdata/api exec prisma migrate deploy
      - run: pnpm test:int
      - run: pnpm build
